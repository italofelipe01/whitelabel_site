{% extends "base.html" %}

{% block title %}Erro {{ status_code }}{% endblock %}

{% block body %}
<main class="status-page">
    <section class="status-panel">
        <p class="eyebrow">Erro {{ status_code }}</p>
        <h1>Não foi possível concluir a solicitação</h1>
        <p>{{ message }}</p>
        <div class="status-actions">
            <a href="{{ url_for('main.landing_page') }}">Voltar ao hub</a>
        </div>
    </section>
</main>
{% endblock %}
